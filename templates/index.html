{% extends "base.html" %}

{% block content %}

<section class="hero">
    <h1>Book Your Bus Tickets</h1>
    <p>Travel safely and comfortably with EasyBus</p>
</section>

<form class="panel search" action="/search" method="GET">

    <label>From
        <input type="text" name="source"
               placeholder="Hyderabad" required>
    </label>

    <label>To
        <input type="text" name="destination"
               placeholder="Vijayawada" required>
    </label>

    <label>Journey Date
        <input type="date" name="travel_date" required>
    </label>

    <button type="submit">Search Buses</button>

</form>

{% endblock %}
