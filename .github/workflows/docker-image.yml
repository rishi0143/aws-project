
name: Bus Booking Full DevOps CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: bus-booking

jobs:

  # ==========================================
  # JOB 1: PYTHON MATRIX INSTALL AND TEST
  # ==========================================
  matrix-testing:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      - name: Run Python Tests
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            pytest -v
          else
            echo "No test files found. Checking Python syntax."
            python -m compileall -q .
          fi

  # ==========================================
  # JOB 2: SONARQUBE CODE QUALITY
  # ==========================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: matrix-testing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Check SonarQube Connection
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL is missing"
            exit 1
          fi

          case "$SONAR_HOST_URL" in
            http://*|https://*) ;;
            *)
              echo "SONAR_HOST_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          curl --fail --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          scannerVersion: '4.8.1.3023'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ==========================================
  # JOB 3: DOCKER BUILD + TRIVY SECURITY
  # ==========================================
  docker-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs:
      - matrix-testing
      - sonarqube

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${{ github.sha }}" .

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${{ github.sha }}"

  # ==========================================
  # JOB 4: UPDATE KUBERNETES GITOPS MANIFEST
  # ==========================================
  update-gitops:
    name: Update Kubernetes Image
    runs-on: ubuntu-latest
    needs: docker-security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Deployment Image
        run: |
          sed -i \
            "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${{ github.sha }}|" \
            k8s/deployment.yaml

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update Bus Booking image [skip ci]"
            git push origin HEAD:main
          fi
