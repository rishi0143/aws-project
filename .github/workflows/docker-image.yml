
name: Python SonarQube and Trivy Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-analysis:
    name: SonarQube and Trivy Security
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Python syntax check
      - name: Python Syntax Check
        run: |
          python -m compileall -q .

      # 5. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 6. Install SonarScanner
      - name: Install SonarScanner
        run: |
          curl -fSL -o sonar-scanner.zip \
          https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip

          unzip -q sonar-scanner.zip

          echo "$GITHUB_WORKSPACE/sonar-scanner-4.8.0.2856-linux/bin" >> $GITHUB_PATH

      # 7. Check SonarQube server
      - name: Check SonarQube Server
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          for i in {1..30}; do
            if curl -fsS "$SONAR_HOST_URL/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube server is UP"
              exit 0
            fi
            sleep 10
          done

          echo "SonarQube server is unavailable"
          exit 1

      # 8. SonarQube analysis
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=rishi0143 \
            -Dsonar.projectName=aws-project \
            -Dsonar.sources=. \
            -Dsonar.inclusions=**/*.py \
            -Dsonar.exclusions=terraform/**,k8t/**,.github/**,**/__pycache__/**,**/venv/**,**/.venv/** \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.python.version=3.11 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      # 9. Install Trivy
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.68.2

      # 10. Verify Trivy
      - name: Trivy Version
        run: trivy --version

      # 11. Filesystem security scan
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            .

      # 12. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t bus-booking:latest .

      # 13. Scan Docker image
      - name: Trivy Docker Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            bus-booking:latest

      # 14. Pipeline success
      - name: Pipeline Success
        run: |
          echo "Python syntax check passed"
          echo "SonarQube analysis passed"
          echo "Trivy filesystem scan passed"
          echo "Docker image scan passed"
