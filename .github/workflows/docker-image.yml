
name: Python SonarQube and Trivy Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-analysis:
    name: Code Quality and Security
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install Python dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. Python syntax check
      - name: Python Syntax Check
        run: |
          python -m compileall -q app.py

      # 5. Check SonarQube server
      - name: Check SonarQube Server
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          for i in {1..30}; do

            if curl -fsS "$SONAR_HOST_URL/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube server is UP"
              exit 0
            fi

            echo "Waiting for SonarQube..."
            sleep 10
          done

          echo "SonarQube server unavailable"
          exit 1

      # 6. SonarQube Code Quality Analysis
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            -w /usr/src \
            sonarsource/sonar-scanner-cli:4.8 \
            -Dsonar.projectKey=rishi0143 \
            -Dsonar.projectName=aws-project \
            -Dsonar.sources=. \
            -Dsonar.inclusions=**/*.py,**/*.html,**/*.css \
            -Dsonar.exclusions=terraform/**,k8t/**,.github/**,**/__pycache__/**,**/venv/**,**/.venv/** \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.python.version=3.11 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      # 7. Install Trivy
      - name: Install Trivy
        run: |
          curl -fL \
            https://github.com/aquasecurity/trivy/releases/download/v0.68.2/trivy_0.68.2_Linux-64bit.deb \
            -o trivy.deb

          sudo dpkg -i trivy.deb

          trivy --version

      # 8. Trivy Filesystem Security Scan
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

      # 9. Build Docker image
      - name: Docker Build
        run: |
          docker build -t bus-booking:latest .

      # 10. Trivy Docker Image Scan
      - name: Trivy Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            bus-booking:latest

      # 11. Final success
      - name: Pipeline Success
        run: |
          echo "Python syntax check completed"
          echo "SonarQube Quality Gate passed"
          echo "Trivy filesystem scan passed"
          echo "Docker image built successfully"
          echo "Trivy image scan passed"
