
name: Bus Booking DevOps CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: bus-booking
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # 1. MATRIX BUILD AND TEST
  matrix-test:
    name: Python ${{ matrix.python-version }} Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python Tests
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            python -m compileall -q .
          fi

  # 2. SONARQUBE CODE QUALITY
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: matrix-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 3. DOCKER BUILD, TRIVY SCAN AND PUSH
  docker-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs:
      - matrix-test
      - sonarqube

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Setup
        uses: docker/setup-buildx-action@v3

      - name: Docker Build
        run: |
          docker build -t $IMAGE_NAME:${GITHUB_SHA::7} .

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: bus-booking:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Push
        if: github.event_name == 'push'
        run: |
          docker tag $IMAGE_NAME:${GITHUB_SHA::7} \
            $DOCKERHUB_USERNAME/$IMAGE_NAME:${GITHUB_SHA::7}

          docker push \
            $DOCKERHUB_USERNAME/$IMAGE_NAME:${GITHUB_SHA::7}

  # 4. UPDATE GITOPS REPOSITORY
  update-gitops:
    name: Update Kubernetes Image
    runs-on: ubuntu-latest
    needs: docker-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps Repository
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ vars.GITOPS_REPO }}.git gitops

      - name: Update Image Tag
        run: |
          cd gitops

          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${GITHUB_SHA::7}|" \
            k8s/deployment.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update bus-booking image to ${GITHUB_SHA::7}"
            git push
          fi
