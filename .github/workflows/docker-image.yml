name: KubeCI

on:
  push:
    branches:
      - main

jobs:
  rishi:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Git checkout
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -t rishi784/gha:${SHORT_SHA} .
          docker tag rishi784/gha:${SHORT_SHA} rishi784/gha:latest

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Push Docker image
      - name: Push Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker push rishi784/gha:${SHORT_SHA}
          docker push rishi784/gha:latest

      # 5. Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # 6. Connect to Kubernetes cluster
      - name: Configure Kubernetes
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl get nodes

      # 7. Deploy application
      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment.yaml
          SHORT_SHA=${GITHUB_SHA::7}
          kubectl set image deployment/pyapp pyapp=rishi784/gha:${SHORT_SHA}

      # 8. Apply HPA
      - name: Apply HPA
        run: |
          kubectl apply -f k8s/hpa.yaml

      # 9. Verify deployment
      - name: Check Kubernetes Status
        run: |
          kubectl rollout status deployment/pyapp
          kubectl get pods
          kubectl get deployments
          kubectl get hpa
