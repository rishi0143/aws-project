name: KubeCI

on:
  push:
    branches:
      - main

jobs:
  PythonCI:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -t rishi784/gha-pyapp:${SHORT_SHA} .
      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Push Docker image
      - name: Push Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker push rishi784/gha-pyapp:${SHORT_SHA}
      # 5. Install yq
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
      # 6. Update Kubernetes deployment image
      - name: Update deployment.yml
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          export SHORT_SHA
          yq -i '.spec.template.spec.containers[0].image = "rishi784/gha-pyapp:" + strenv(SHORT_SHA)' \
            ./k8s/pyapp-deployment.yml
          echo "Updated Docker image:"
          yq '.spec.template.spec.containers[0].image' \
            ./k8s/pyapp-deployment.yml
      # 7. Commit updated deployment file
      - name: Commit deployment file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/pyapp-deployment.yml
          git commit -m "Update Docker image tag" || echo "No changes to commit"
          git push origin main
