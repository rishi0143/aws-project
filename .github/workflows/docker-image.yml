
name: KubeCI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: rishi784/aws-project
  AWS_REGION: ap-south-1
  EKS_CLUSTER: my-eks-cluster3

jobs:

  PythonCI:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub Login
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build Docker Image
      - name: Build Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -t $IMAGE_NAME:$SHORT_SHA .
          docker tag $IMAGE_NAME:$SHORT_SHA $IMAGE_NAME:latest

      # 5. Push Docker Image
      - name: Push Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker push $IMAGE_NAME:$SHORT_SHA
          docker push $IMAGE_NAME:latest

      # 6. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 7. Connect to EKS Cluster
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      # 8. Deploy Kubernetes Manifests
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8t/deployment.yaml
          kubectl apply -f k8t/service.yaml
          kubectl apply -f k8t/hpa.yaml

      # 9. Update Docker Image in Deployment
      - name: Update Deployment Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          kubectl set image deployment/pyapp \
            pyapp=$IMAGE_NAME:$SHORT_SHA

      # 10. Verify Deployment
      - name: Check Kubernetes Deployment
        run: |
          kubectl rollout status deployment/pyapp
          kubectl get pods
          kubectl get svc
          kubectl get hpa
