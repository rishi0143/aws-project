
name: KubeCI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: my-eks-cluster5
  DOCKER_IMAGE: rishi784/gha-pyapp

jobs:
  PythonCI:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Generate Docker image tag
      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 3. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t $DOCKER_IMAGE:$IMAGE_TAG .

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push $DOCKER_IMAGE:$IMAGE_TAG

      # 6. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 7. Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # 8. Verify AWS account
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 9. Connect to EKS cluster
      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name my-eks-cluster5

          kubectl get nodes

      # 10. Install Metrics Server
      - name: Install Metrics Server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          kubectl rollout status deployment/metrics-server \
            -n kube-system \
            --timeout=180s

      # 11. Verify Metrics Server
      - name: Verify Metrics Server
        run: |
          kubectl get deployment metrics-server -n kube-system
          kubectl get apiservices v1beta1.metrics.k8s.io

          for i in {1..12}; do
            if kubectl top nodes; then
              exit 0
            fi
            echo "Waiting for Metrics Server..."
            sleep 10
          done

          echo "Metrics Server is not providing metrics"
          exit 1

      # 12. Deploy Kubernetes application
      - name: Deploy Application
        run: |
          kubectl apply -f k8t/deployment.yaml
          kubectl apply -f k8t/service.yaml

          kubectl set image deployment/bus-booking \
            bus-booking=$DOCKER_IMAGE:$IMAGE_TAG

          kubectl rollout status deployment/bus-booking \
            --timeout=180s

      # 13. Configure HPA
      - name: Configure HPA
        run: |
          kubectl apply -f k8t/hpa.yaml

      # 14. Verify HPA and pods
      - name: Verify HPA
        run: |
          kubectl get hpa
          kubectl describe hpa bus-booking-hpa
          kubectl get pods
          kubectl top pods

      # 15. Deployment status
      - name: Deployment Status
        if: always()
        run: |
          kubectl get deployments || true
          kubectl get pods || true
          kubectl get services || true
          kubectl get hpa || true
