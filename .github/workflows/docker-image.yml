
name: Bus Booking DevOps CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: bus-booking

jobs:

  # 1. MATRIX TESTING
  matrix-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fix Broken Submodule Configuration
        run: |
          git config --local --remove-section \
            submodule.aws-project || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Python Tests
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            python -m compileall -q .
          fi

  # 2. SONARQUBE
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: matrix-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fix Broken Submodule Configuration
        run: |
          git config --local --remove-section \
            submodule.aws-project || true

      - name: Check SonarQube Connection
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Checking SonarQube server..."

          curl --fail --show-error --silent \
            --connect-timeout 15 \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 3. DOCKER + TRIVY
  docker-security:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest
    needs:
      - matrix-test
      - sonarqube

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fix Broken Submodule Configuration
        run: |
          git config --local --remove-section \
            submodule.aws-project || true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -t bus-booking:${GITHUB_SHA::7} .

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: bus-booking:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker tag bus-booking:${GITHUB_SHA::7} \
            ${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${GITHUB_SHA::7}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${GITHUB_SHA::7}

  # 4. UPDATE GITOPS REPOSITORY
  update-gitops:
    name: Update GitOps Image
    runs-on: ubuntu-latest
    needs: docker-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Clone GitOps Repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
        run: |
          git clone \
            https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git \
            gitops

      - name: Update Kubernetes Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          cd gitops

          sed -i "s|image: .*|image: ${DOCKERHUB_USERNAME}/bus-booking:${SHORT_SHA:0:7}|" \
            k8s/deployment.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update bus-booking image"
            git push
          fi
