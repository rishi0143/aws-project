
name: Python-SonarQube-Trivy-CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-and-quality:
    name: Python Code Quality and Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install Python dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. Python syntax validation
      - name: Python Syntax Check
        run: |
          python -m compileall -q .

      # 5. Setup Java runtime for older SonarScanner CLI
      # This is NOT for building a Java application.
      - name: Setup Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # 6. Install SonarScanner CLI
      - name: Install SonarScanner
        run: |
          curl -fL -o sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip -q sonar-scanner.zip
          echo "$GITHUB_WORKSPACE/sonar-scanner-4.8.0.2856-linux/bin" >> "$GITHUB_PATH"

      # 7. Check SonarQube server
      - name: Check SonarQube Server
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -fsS -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/system/status"

      # 8. SonarQube analysis
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=rishi0143 \
            -Dsonar.projectName=aws-project \
            -Dsonar.sources=. \
            -Dsonar.inclusions='**/*.py,**/*.html,**/*.css' \
            -Dsonar.exclusions='terraform/**,k8t/**,.github/**,**/__pycache__/**,**/venv/**,**/.venv/**' \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.python.version=3.11 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

 
      # 9. Install Trivy using official repository
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      # 10. Trivy Filesystem Scan
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

      # 11. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t bus-booking:latest .

      # 12. Trivy Docker Image Scan
      - name: Trivy Docker Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            bus-booking:latest

