
name: HPA-CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: my-eks-cluster3

jobs:
  HPA-Deploy:
    name: Deploy and Test HPA
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify AWS IAM Role
        run: |
          aws sts get-caller-identity

      - name: Connect to EKS Cluster
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Check Kubernetes Nodes
        run: |
          kubectl get nodes

      - name: Check Metrics Server
        run: |
          kubectl get deployment metrics-server -n kube-system
          kubectl top nodes

      - name: Apply Kubernetes Deployment
        run: |
          kubectl apply -f k8t/deployment.yaml

      - name: Apply Kubernetes Service
        run: |
          kubectl apply -f k8t/service.yaml

      - name: Apply HPA
        run: |
          kubectl apply -f k8t/hpa.yaml

      - name: Verify HPA
        run: |
          kubectl get hpa
          kubectl describe hpa pyapp-hpa

      - name: Verify Pods
        run: |
          kubectl get pods
          kubectl get deployment
