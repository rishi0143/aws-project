
name: HPA-CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: my-eks-cluster3

jobs:
  HPA-Deploy:
    name: Deploy and Test HPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Check Kubernetes Nodes
        run: kubectl get nodes

      - name: Check Metrics Server
        run: |
          kubectl get deployment metrics-server -n kube-system
          kubectl top nodes

      - name: Deploy Application
        run: |
          kubectl apply -f k8t/deployment.yaml
          kubectl apply -f k8t/service.yaml

      - name: Deploy HPA
        run: |
          kubectl apply -f k8t/hpa.yaml

      - name: Verify HPA
        run: |
          kubectl get hpa
          kubectl describe hpa pyapp-hpa
          kubectl get pods
