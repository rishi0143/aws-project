
name: KubeCI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: my-eks-cluster5
  DOCKER_IMAGE: rishi784/gha-pyapp

jobs:
  PythonCI:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Generate image tag
      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 3. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t $DOCKER_IMAGE:$IMAGE_TAG .

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Push Docker image
      - name: Push Docker Image
        run: |
          docker push $DOCKER_IMAGE:$IMAGE_TAG

      # 6. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 7. Verify AWS Identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

            # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      # 4. Python syntax validation
      - name: Python Syntax Check
        run: |
          python -m compileall -q .
      # 5. Setup Java for SonarScanner
      # Java is required by this older SonarScanner,
      # not for your Python application.
      - name: Setup Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # 6. Install SonarScanner
      - name: Install SonarScanner
        run: |
          curl -fL -o sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip -q sonar-scanner.zip
          echo "$GITHUB_WORKSPACE/sonar-scanner-4.8.0.2856-linux/bin" >> "$GITHUB_PATH"
      # 7. Check SonarQube server
      - name: Check SonarQube Server
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -fsS -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/system/status"
      # 8. SonarQube scan
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=rishi0143 \
            -Dsonar.projectName=aws-project \
            -Dsonar.sources=. \
            -Dsonar.inclusions='**/*.py,**/*.html,**/*.css' \
            -Dsonar.exclusions='terraform/**,k8t/**,.github/**,**/__pycache__/**,**/venv/**,**/.venv/**' \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.python.version=3.11 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true
      # 9. Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version
      # 10. Trivy filesystem scan
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --format table \
            --ignore-unfixed \
            --exit-code 0 \
            .
      # 11. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t bus-booking:latest .
      # 12. Trivy Docker image scan
      - name: Trivy Docker Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --ignore-unfixed \
            --exit-code 0 \
            bus-booking:latest
      # 13. Pipeline completed
      - name: Pipeline Success
        run: |
          echo "Python Syntax Check Completed"
          echo "SonarQube Scan Completed"
          echo "Trivy Filesystem Scan Completed"
          echo "Docker Build Completed"
          echo "Trivy Image Scan Completed"


