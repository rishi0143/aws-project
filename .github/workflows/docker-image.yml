
name: KubeCI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  PythonCI:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -t rishi784/gha-pyapp:${SHORT_SHA} .

      # 3. Trivy Image Scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rishi784/gha-pyapp:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Push Docker image
      - name: Push Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker push rishi784/gha-pyapp:${SHORT_SHA}

      # 6. Install yq
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      # 7. Update Kubernetes deployment image
      - name: Update Deployment Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          export SHORT_SHA

          yq -i '.spec.template.spec.containers[0].image = "rishi784/gha-pyapp:" + strenv(SHORT_SHA)' \
            k8t/deployment.yaml

          echo "Updated Docker image:"
          yq '.spec.template.spec.containers[0].image' k8t/deployment.yaml

      # 8. Commit updated deployment file
      - name: Commit Kubernetes Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8t/deployment.yaml
          git commit -m "Update Docker image tag [skip ci]" || echo "No changes to commit"
          git push origin main
