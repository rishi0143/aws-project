
name: Python SonarQube and Trivy Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  security-analysis:
    name: Code Quality and Security
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Python syntax validation
      - name: Python Syntax Check
        run: |
          python -m compileall -q .

      # 5. Setup Java for SonarQube 8.9
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 6. Install SonarScanner
      - name: Install SonarScanner
        run: |
          curl -fSL -o sonar-scanner.zip \
          https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip

          unzip -q sonar-scanner.zip
          echo "$GITHUB_WORKSPACE/sonar-scanner-4.8.0.2856-linux/bin" >> $GITHUB_PATH

      # 7. SonarQube server check
      - name: Check SonarQube Server
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          for i in {1..30}; do
            if curl -fsS "$SONAR_HOST_URL/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube is UP"
              exit 0
            fi
            sleep 10
          done
          echo "SonarQube server unavailable"
          exit 1

      # 8. SonarQube analysis
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=rishi0143 \
            -Dsonar.projectName=aws-project \
            -Dsonar.sources=. \
            -Dsonar.inclusions=**/*.py \
            -Dsonar.exclusions=terraform/**,k8t/**,.github/**,**/__pycache__/**,**/venv/**,**/.venv/** \
            -Dsonar.python.version=3.11 \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      # 9. Install Trivy
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.4
        with:
          version: latest

      # 10. Trivy filesystem scan
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

      # 11. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t bus-booking:latest .

      # 12. Trivy Docker image scan
      - name: Trivy Docker Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            bus-booking:latest

      # 13. Security scan completed
      - name: Security Pipeline Success
        run: |
          echo "SonarQube analysis completed"
          echo "Trivy filesystem scan completed"
          echo "Trivy Docker image scan completed"
          echo "All security checks passed"
