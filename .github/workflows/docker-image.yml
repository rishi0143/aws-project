
name: AWS Project CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: rishi784/aws-project

jobs:

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy Application on AWS EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Connect EC2 and Deploy
        uses: appleboy/ssh-action@v1.2.2

        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN

          script: |
            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" --password-stdin

            docker pull ${IMAGE_NAME}:latest

            docker stop aws-project || true
            docker rm aws-project || true

            docker run -d \
              --name aws-project \
              --restart unless-stopped \
              -p 80:5000 \
              -v /home/ubuntu/aws-data/bus_booking.db:/app/bus_booking.db \
              ${IMAGE_NAME}:latest

            docker logout

            docker ps
