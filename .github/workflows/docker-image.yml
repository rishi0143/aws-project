name: KubeCI

on:
  push:
    branches:
      - main
permissions: 
     contents: write

jobs:
  PythonCI:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -t rishi784/gha-pyapp:${SHORT_SHA} .

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Push Docker image
      - name: Push Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker push rishi784/gha-pyapp:${SHORT_SHA}

      # 5. Install yq
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      # 6. Verify Kubernetes files
      - name: Verify Kubernetes files
        run: |
          ls -la
          ls -la ./k8t/
          test -f ./k8t/deployment.yaml

      # 7. Update Kubernetes deployment image
      - name: Update deployment.yaml
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          export SHORT_SHA

          yq -i '.spec.template.spec.containers[0].image = "rishi784/gha-pyapp:" + strenv(SHORT_SHA)' \
            ./k8t/deployment.yaml

          echo "Updated Docker image:"
          yq '.spec.template.spec.containers[0].image' \
            ./k8t/deployment.yaml

      # 8. Commit updated deployment file
      - name: Commit deployment file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

           # 5. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # 7. Verify AWS Identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
      # 8. Connect to EKS
      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME
      # 9. Check Kubernetes Nodes
      - name: Check Kubernetes Nodes
        run: |
          kubectl get nodes
          kubectl get pods -A
      # 10. Check Metrics Server
      - name: Check Metrics Server
        run: |
          kubectl get apiservices v1beta1.metrics.k8s.io
          kubectl top nodes
      # 11. Deploy Application
      - name: Deploy Application
        run: |
          kubectl apply -f k8t/deployment.yaml
          kubectl apply -f k8t/service.yaml
          kubectl set image deployment/bus-booking \
            bus-booking=$DOCKER_IMAGE:${GITHUB_SHA::7}
          kubectl rollout status deployment/bus-booking \
            --timeout=180s
      # 12. Configure HPA
      - name: Configure HPA
        run: |
          kubectl apply -f k8t/hpa.yaml
      # 13. Test HPA
      - name: Test HPA
        run: |
          kubectl get hpa
          kubectl describe hpa
          kubectl top pods
      # 14. Final Deployment Status
      - name: Deployment Status
        if: always()
        run: |
          kubectl get deployments || true
          kubectl get pods || true
          kubectl get services || true
          kubectl get hpa || true

          git add k8t/deployment.yaml

          git commit -m "Update Docker image tag" || echo "No changes to commit"

          git push origin main
