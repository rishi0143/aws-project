
name: Bus Booking Full DevOps CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =====================================
  # JOB 1: PYTHON MATRIX TESTING
  # =====================================
  matrix-testing:
    name: Python ${{ matrix.python-version }} Testing
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      - name: Run Python Tests
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            pytest -v
          else
            echo "No test files found. Checking Python syntax."
            python -m compileall -q .
          fi

  # =====================================
  # JOB 2: SONARQUBE ANALYSIS
  # =====================================
  sonarqube:
    name: SonarQube Code Quality
    runs-on: ubuntu-latest
    needs: matrix-testing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Check SonarQube Connection
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL secret is missing"
            exit 1
          fi

          SONAR_HOST_URL="${SONAR_HOST_URL%/}"

          curl --fail --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status"

      - name: SonarQube Scan Using Docker
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          SONAR_HOST_URL="${SONAR_HOST_URL%/}"

          docker pull sonarsource/sonar-scanner-cli:4.8.1

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            -w /usr/src \
            sonarsource/sonar-scanner-cli:4.8.1 \
            -Dsonar.projectBaseDir=/usr/src

  # =====================================
  # JOB 3: DOCKER BUILD AND TRIVY SCAN
  # =====================================
  docker-security:
    name: Docker Build and Trivy Security
    runs-on: ubuntu-latest

    needs:
      - matrix-testing
      - sonarqube

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/bus-booking:$IMAGE_TAG" .

      # TRIVY FILESYSTEM SCAN
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # TRIVY DOCKER IMAGE SCAN
      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKER_USERNAME }}/bus-booking:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # DOCKER HUB LOGIN
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PUSH DOCKER IMAGE
      - name: Push Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$DOCKER_USERNAME/bus-booking:$IMAGE_TAG"

  # =====================================
  # JOB 4: UPDATE KUBERNETES MANIFEST
  # =====================================
  update-gitops:
    name: Update Kubernetes GitOps
    runs-on: ubuntu-latest

    needs: docker-security

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Kubernetes Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/deployment.yaml")

          if not path.exists():
              raise SystemExit("k8s/deployment.yaml not found")

          content = path.read_text()

          image = (
              f"{os.environ['DOCKER_USERNAME']}/"
              f"bus-booking:{os.environ['IMAGE_TAG']}"
          )

          updated, count = re.subn(
              r"(?m)^(\s*image:\s*).+$",
              lambda match: match.group(1) + image,
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not find Deployment image field")

          path.write_text(updated)
          PY

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update Bus Booking Docker image"
            git push origin HEAD:main
          else
            echo "No manifest changes"
          fi
