
name: KubeCI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: rishi784/aws-project
  AWS_REGION: ap-south-1
  EKS_CLUSTER: my-eks-cluster3

jobs:
  PythonCI:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Docker Buildx Setup
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub Login
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            rishi784/aws-project:${{ github.sha }}
            rishi784/aws-project:latest

      # 5. Configure AWS Credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Verify AWS Authentication
      - name: Verify AWS Credentials
        run: |
          aws sts get-caller-identity

      # 7. Connect to AWS EKS
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      # 8. Deploy Kubernetes Manifests
      - name: Deploy Kubernetes
        run: |
          kubectl apply -f k8t/deployment.yaml
          kubectl apply -f k8t/service.yaml
          kubectl apply -f k8t/hpa.yaml

      # 9. Update Deployment Image
      - name: Update Deployment Image
        run: |
          kubectl set image deployment/pyapp \
            pyapp=$IMAGE_NAME:${{ github.sha }}

      # 10. Check Deployment Status
      - name: Verify Kubernetes Deployment
        run: |
          kubectl rollout status deployment/pyapp --timeout=180s
          kubectl get pods
          kubectl get deployment
          kubectl get svc
          kubectl get hpa
