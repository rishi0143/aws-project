
name: Bus Booking Complete DevOps CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: bus-booking

jobs:

  # ==================================
  # 1. MATRIX BUILD AND TEST
  # ==================================
  matrix-test:
    name: Python ${{ matrix.python-version }} Testing
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      - name: Run Python Tests
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            python -m compileall -q .
          fi

  # ==================================
  # 2. SONARQUBE CODE QUALITY
  # ==================================
  sonarqube:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    needs: matrix-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Check SonarQube Connection
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL secret is missing"
            exit 1
          fi

          echo "Checking SonarQube server..."

          curl --fail --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          scannerVersion: 4.8.1.3023
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ==================================
  # 3. DOCKER BUILD AND TRIVY SCAN
  # ==================================
  docker-security:
    name: Docker Build and Trivy Security
    runs-on: ubuntu-latest
    needs:
      - matrix-test
      - sonarqube

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${GITHUB_SHA::7} .

      # TRIVY FILESYSTEM SCAN
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

      # TRIVY IMAGE SCAN
      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      # DOCKER HUB LOGIN
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # DOCKER PUSH
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/bus-booking:${GITHUB_SHA::7}

  # ==================================
  # 4. UPDATE GITOPS REPOSITORY
  # ==================================
  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs: docker-security

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops

      - name: Update Kubernetes Image
        working-directory: gitops
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          sed -i \
            "s|image: .*|image: ${DOCKERHUB_USERNAME}/bus-booking:${SHORT_SHA:0:7}|" \
            k8s/deployment.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update Bus Booking Docker Image"
            git push origin main
          fi
