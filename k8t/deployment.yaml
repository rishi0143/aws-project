
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bus-booking
  template:
    metadata:
      labels:
        app: bus-booking
    spec:
      containers:
        - name: bus-booking
          image: rishi784/bus-booking:latest
          ports:
            - containerPort: 5000
