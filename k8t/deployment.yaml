apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bus-booking
  template:
    metadata:
      labels:
        app: bus-booking
    spec:
      containers:
        - name: bus-booking
          image: rishi784/gha-pyapp:a968977
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
